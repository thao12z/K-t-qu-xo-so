<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Real World Input</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        .test-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .box {
            border: 2px solid #ddd;
            padding: 15px;
            border-radius: 4px;
        }
        .box h3 {
            margin-top: 0;
            color: #E36323;
        }
        .input-box {
            background: #f9f9f9;
        }
        .output-box {
            background: #e8f5e9;
        }
        pre {
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.6;
        }
        .stats {
            background: #fff3e0;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Real World Input</h1>

        <div class="test-section">
            <div class="box input-box">
                <h3>📝 Tin nhận trước khi phân tích</h3>
                <pre id="input-display"></pre>
            </div>
            <div class="box output-box">
                <h3>✅ Tin nhận sau khi phân tích</h3>
                <pre id="output-display"></pre>
            </div>
        </div>

        <div class="stats" id="stats"></div>
    </div>

    <script src="js/user/main-reconciliation-final.js"></script>
    <script>
        const sampleInput = `tin 1:
de 00 x 1070n. 90 x 735n. 11 x 330n. 16 x 310n. 25 x 195n. 55 x 84n. 50 x 10n.
tin 2:
de 00 x 1043n. 26 x 622n. 10 x 510n. 96 x 509n. 41 x 456n. 11 x 353n. 05 x 174n. 19 x 128n. 16 x 125n. 50 x 107n. 27 x 102n. 17,56 x 94n. 22 x 86n. 44 x 78n. 90 x 75n. 55 x 33n.
xien quay 00,07,68,54 x 2000
xq 00,07,54,66 x 1000
tin 3:
de 44 x 1079n. 05 x 780n. 24 x 332n. 98 x 65n. 89 x 51n. 99 x 32n. 09 x 7n. 00 x 6n. 50 x 5n.
de dau 5 dit 5 x1000n
de 525 535 565 575 595 x1000n
tin 4:
de 50 8000n
de 00 x 674n. 90 x 208n. 50 x 130n. 09 x 104n. 59 x 102n. 12,92 x 73n.
lo 32 23`;

        // Display input
        document.getElementById('input-display').textContent = sampleInput;

        // Process with preprocessor
        console.clear();
        console.log('=== TESTING PREPROCESSOR ===');

        const startTime = performance.now();
        const result = window.advancedPreprocessInput(sampleInput);
        const endTime = performance.now();

        // Display output
        let outputText = '';
        result.forEach((line, index) => {
            outputText += `${line}\n`;
        });
        document.getElementById('output-display').textContent = outputText;

        // Display stats
        const inputLines = sampleInput.split('\n').length;
        const outputLines = result.length;
        const duration = (endTime - startTime).toFixed(2);

        document.getElementById('stats').innerHTML = `
            <strong>📊 Thống kê:</strong><br>
            Input lines: ${inputLines}<br>
            Output lines: ${outputLines}<br>
            Processing time: ${duration}ms<br>
            <br>
            <strong>✅ Test cases đã check:</strong><br>
            - "tin X:" markers được skip<br>
            - Multi-bet với dấu chấm được tách<br>
            - Nhiều số cùng tiền (17,56 x 94n)<br>
            - Xiên quay format<br>
            - Đề đầu/đít<br>
            - Số 3 chữ số<br>
            - <strong>"de 50 8000n" = 8 triệu ✅</strong><br>
            - Lo với điểm<br>
            - Output format: "de 00-1043" (dấu gạch ngang)
        `;

        console.log('=== RESULTS ===');
        console.log(`Input: ${inputLines} lines`);
        console.log(`Output: ${outputLines} lines`);
        console.log(`Time: ${duration}ms`);
        console.log('Output:', result);
    </script>
</body>
</html>
