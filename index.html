<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Đối Soát Lô Đề - Dành Cho Đại Lý</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        .loading-spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <h2 class="text-xl font-semibold text-gray-900 mb-2">Đang tải hệ thống...</h2>
            <p class="text-gray-600">Vui lòng đợi trong giây lát</p>
            <div id="loading-progress" class="text-sm text-gray-500 mt-2">Khởi tạo...</div>
        </div>
    </div>
    
    <!-- Main App Container -->
    <div id="root" class="min-h-screen"></div>
    
    <!-- Scripts - Load theo thứ tự đơn giản -->
    
    <!-- 1. Core Services -->
    <script type="text/babel" src="global-state-manager.js?v=4.0.2" onerror="console.error('Failed to load:', this.src)"></script>
    <script type="text/babel" src="shared-data-service.js?v=2.3.0" onerror="console.error('Failed to load:', this.src)"></script>
    <script type="text/babel" src="lottery-data-service.js?v=2.14.0" onerror="console.error('Failed to load:', this.src)"></script>
    <script type="text/babel" src="bet-parser.js?v=1.3.0" onerror="console.error('Failed to load:', this.src)"></script>
    <script type="text/babel" src="auth-system.js?v=1.5.0" onerror="console.error('Failed to load:', this.src)"></script>
    
    <!-- 2. Page Components - 5 TRANG BẮT BUỘC -->
    <script type="text/babel" src="landing-page.js?v=2.2.0" onerror="console.error('Failed to load:', this.src)"></script>
    <script type="text/babel" src="formula-page.js?v=1.0.1" onerror="console.error('Failed to load:', this.src)"></script>
    <script type="text/babel" src="main-reconciliation-final.js?v=12.0.0" onerror="console.error('Failed to load:', this.src)"></script>
    <script type="text/babel" src="pricing-page.js?v=1.1.2" onerror="console.error('Failed to load:', this.src)"></script>
    
    <!-- 3. Main App -->
    <script type="text/babel" src="main-agent.js?v=9.1.2" onerror="console.error('Failed to load:', this.src)"></script>
    

    
    <!-- 4. Simple Initializer -->
    <script type="text/babel">
        (function() {
            'use strict';
            
            console.log('🎯 Starting User System...');
            
            const loadingProgress = document.getElementById('loading-progress');
            const loadingSteps = [
                'Tải Global State Manager...',
                'Tải Authentication System...',
                'Tải 5 trang chính...',
                'Khởi tạo Main App...',
                'Sẵn sàng!'
            ];
            
            let currentStep = 0;
            const updateProgress = () => {
                if (loadingProgress && currentStep < loadingSteps.length) {
                    loadingProgress.textContent = loadingSteps[currentStep];
                    currentStep++;
                }
            };
            
            const progressInterval = setInterval(updateProgress, 800);
            
            // Simple initialization
            const initializeApp = () => {
                try {
                    console.log('🔧 Initializing...');
                    console.log('🔍 DEBUG: initializeApp started successfully');
                    
                                         // Check required components
                     const requiredComponents = [
                         'GlobalStateManager',
                         'SharedDataService',
                         'LotteryDataService',
                         'AuthService', 
                         'LandingPage',
                         'LoginPage',
                         'FormulaPage',
                         'MainReconciliation',
                         'PricingPage',
                         'MainAgentSystem'
                     ];
                    
                    let missingComponents = [];
                    for (const component of requiredComponents) {
                        if (!window[component]) {
                            missingComponents.push(component);
                        }
                    }
                    
                    if (missingComponents.length > 0) {
                        throw new Error(`Missing components: ${missingComponents.join(', ')}`);
                    }
                    
                    console.log('✅ All components loaded successfully');
                    
                    // Initialize main app
                    if (window.MainAgentSystem && window.MainAgentSystem.initialize) {
                        window.MainAgentSystem.initialize();
                    } else {
                        throw new Error('MainAgentSystem.initialize not found');
                    }
                    
                    // Hide loading screen
                    const loadingScreen = document.getElementById('loading-screen');
                    if (loadingScreen) {
                        loadingScreen.style.opacity = '0';
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 300);
                    }
                    
                    clearInterval(progressInterval);
                    console.log('🎉 User System initialized successfully!');
                    
                } catch (error) {
                    console.error('❌ Initialization failed:', error);
                    if (loadingProgress) {
                        loadingProgress.textContent = `Lỗi: ${error.message}`;
                    }
                    
                    // Show detailed error message
                    setTimeout(() => {
                        const loadingScreen = document.getElementById('loading-screen');
                        if (loadingScreen) {
                            loadingScreen.innerHTML = `
                                <div class="text-center">
                                    <div class="text-6xl mb-4">❌</div>
                                    <h2 class="text-xl font-semibold text-red-600 mb-2">Lỗi Loading Modules</h2>
                                    <p class="text-gray-600 mb-4">Không thể load JavaScript modules. Vui lòng:</p>
                                    <div class="text-left bg-gray-100 p-4 rounded-lg mb-4 text-sm">
                                        <p class="mb-2">1. Đảm bảo server đang chạy: <code class="bg-gray-200 px-1 rounded">python -m http.server 8000</code></p>
                                        <p class="mb-2">2. Truy cập qua: <code class="bg-gray-200 px-1 rounded">http://localhost:8000/user/</code></p>
                                        <p class="mb-2">3. Không mở file HTML trực tiếp</p>
                                        <p class="mb-2">4. Kiểm tra Console (F12) để xem lỗi chi tiết</p>
                                    </div>
                                    <button onclick="location.reload()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
                                        🔄 Thử lại
                                    </button>
                                </div>
                            `;
                        }
                    }, 1000);
                }
            };
            
            // Start initialization when DOM is ready - WITH DEBUG
            console.log('🔍 DEBUG: Document readyState:', document.readyState);
            if (document.readyState === 'loading') {
                console.log('🔍 DEBUG: Adding DOMContentLoaded listener...');
                document.addEventListener('DOMContentLoaded', () => {
                    console.log('🔍 DEBUG: DOMContentLoaded fired, calling initializeApp...');
                    initializeApp();
                });
            } else {
                console.log('🔍 DEBUG: DOM already ready, calling initializeApp immediately...');
                initializeApp();
            }
            
        })();
    </script>
</body>
</html>
