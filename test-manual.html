<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Preprocessor - Manual</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ddd; }
        .input { background: #f0f0f0; padding: 5px; margin: 5px 0; }
        .output { background: #e8f5e9; padding: 5px; margin: 5px 0; white-space: pre-wrap; }
        .error { background: #ffebee; color: red; }
    </style>
</head>
<body>
    <h2>🧪 Test Cases</h2>
    <div id="results"></div>

    <script>
        // Inline the preprocessor code for testing
        function convertToMoney(value, unit) {
            if (!unit || unit === '') return value;
            switch (unit.toLowerCase()) {
                case 'n':
                case 'nn':
                    return value; // n = nghìn, value is already in thousands
                case 'k':
                    return value;
                case 'm':
                    return value * 1000; // m = triệu = 1000 nghìn
                default:
                    return value;
            }
        }

        const testCases = [
            {
                name: "Test 1: Đơn giản - de với n",
                input: "de 50 100n",
                expected: "de 50-100"
            },
            {
                name: "Test 2: Đề 8 triệu",
                input: "de 50 8000n",
                expected: "de 50-8000"
            },
            {
                name: "Test 3: Multi-bet với dấu chấm",
                input: "de 00 x 1070n. 90 x 735n. 11 x 330n.",
                expected: "de 00-1070, de 90-735, de 11-330"
            },
            {
                name: "Test 4: Nhiều số cùng tiền",
                input: "17,56 x 94n",
                expected: "de 17-94, de 56-94"
            },
            {
                name: "Test 5: Xiên quay",
                input: "xien quay 00,07,68,54 x 2000",
                expected: "xien quay 00 07 68 54-2000"
            },
            {
                name: "Test 6: Đề đầu 5",
                input: "de dau 5 x1000n",
                expected: "10 đề (de 50-1000, de 51-1000, ..., de 59-1000)"
            },
            {
                name: "Test 7: Số 3 chữ số",
                input: "de 525 535 x1000n",
                expected: "de 52-1000, de 25-1000, de 53-1000, de 35-1000"
            },
            {
                name: "Test 8: Lo với điểm",
                input: "lo 32 23",
                expected: "lo 32-23"
            },
            {
                name: "Test 9: Tin marker (skip)",
                input: "tin 1:",
                expected: "(skipped)"
            },
            {
                name: "Test 10: Đề với nn",
                input: "de 88 500nn",
                expected: "de 88-500"
            }
        ];

        const resultsDiv = document.getElementById('results');

        testCases.forEach((test, index) => {
            const div = document.createElement('div');
            div.className = 'test';

            let html = `<h3>${test.name}</h3>`;
            html += `<div class="input"><strong>Input:</strong> ${test.input}</div>`;
            html += `<div class="output"><strong>Expected:</strong> ${test.expected}</div>`;

            // Simple parsing logic
            let result = 'Not implemented yet';

            // Test money conversion
            if (test.input.includes('8000n')) {
                const money = convertToMoney(8000, 'n');
                result = `Converted: 8000n = ${money} nghìn = ${money * 1000} VND`;
            }

            html += `<div class="output"><strong>Result:</strong> ${result}</div>`;
            div.innerHTML = html;
            resultsDiv.appendChild(div);
        });

        // Test convert function specifically
        console.log('=== Testing convertToMoney ===');
        console.log('1n =', convertToMoney(1, 'n'), 'nghìn');
        console.log('100n =', convertToMoney(100, 'n'), 'nghìn');
        console.log('8000n =', convertToMoney(8000, 'n'), 'nghìn =', convertToMoney(8000, 'n') * 1000, 'VND');
        console.log('1m =', convertToMoney(1, 'm'), 'nghìn =', convertToMoney(1, 'm') * 1000, 'VND');
    </script>
</body>
</html>
